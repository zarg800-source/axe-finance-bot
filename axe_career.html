<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Axe Career</title>
<script>
(function(){
  var s=localStorage.getItem('mf-theme');
  var sys=window.matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.setAttribute('data-theme', s||(sys?'dark':'light'));
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--radius-card:22px;--radius-pill:999px;--transition:.22s cubic-bezier(.4,0,.2,1);}
[data-theme="light"]{
  --bg:#f5f5f7;--bg2:#ffffff;--bg3:#fafafa;--nav-bg:#1d1d1f;--nav-text:#fff;
  --text:#1d1d1f;--text2:#6e6e73;--text3:#aeaeb2;--divider:rgba(0,0,0,.06);--badge-bg:#f5f5f7;
  --up:#34c759;--down:#ff3b30;--up-bg:rgba(52,199,89,.1);--down-bg:rgba(255,59,48,.1);
  --glass-grad:linear-gradient(165deg, rgba(255,255,255,.62), rgba(255,255,255,.34));
  --glass-bg:rgba(255,255,255,.44);--glass-bg-strong:rgba(255,255,255,.78);--glass-border:rgba(255,255,255,.55);
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 0 0 1px rgba(255,255,255,.18),0 1px 2px rgba(30,32,60,.04),0 18px 40px -16px rgba(30,32,60,.16);
  --glass-shadow-hover:inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 1px rgba(255,255,255,.22),0 24px 48px -16px rgba(30,32,60,.22);
  --blob-1:rgba(30,41,90,.08);--blob-2:rgba(70,130,200,.09);--blob-3:rgba(16,110,80,.06);
  --gold:#3763a8;--gold-light:#6f97d6;--gold-deep:#2a4d85;--gold-border:rgba(55,99,168,.35);--gold-glow:rgba(55,99,168,.35);--gold-bg:rgba(55,99,168,.10);
}
[data-theme="dark"]{
  --bg:#000000;--bg2:#1c1c1e;--bg3:#2c2c2e;--nav-bg:#f5f5f7;--nav-text:#1d1d1f;
  --text:#f5f5f7;--text2:#aeaeb2;--text3:#636366;--divider:rgba(255,255,255,.08);--badge-bg:rgba(255,255,255,.1);
  --up:#30d158;--down:#ff453a;--up-bg:rgba(48,209,88,.15);--down-bg:rgba(255,69,58,.15);
  --glass-grad:linear-gradient(165deg, rgba(255,255,255,.10), rgba(255,255,255,.025));
  --glass-bg:rgba(255,255,255,.055);--glass-bg-strong:rgba(35,35,40,.82);--glass-border:rgba(255,255,255,.10);
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 0 0 1px rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.3),0 24px 48px -16px rgba(0,0,0,.55);
  --glass-shadow-hover:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.07),0 28px 56px -16px rgba(0,0,0,.65);
  --blob-1:rgba(24,34,84,.55);--blob-2:rgba(70,150,220,.16);--blob-3:rgba(16,110,80,.16);
  --gold:#7fa8e8;--gold-light:#a9c6f2;--gold-deep:#5683c9;--gold-border:rgba(127,168,232,.35);--gold-glow:rgba(127,168,232,.45);--gold-bg:rgba(127,168,232,.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100vw}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;position:relative;transition:background var(--transition),color var(--transition);-webkit-font-smoothing:antialiased;}
body::before{content:'';position:fixed;inset:-10%;z-index:0;pointer-events:none;
  background-image:radial-gradient(1100px 900px at 12% -10%, var(--blob-1), transparent 60%),radial-gradient(1000px 800px at 108% 10%, var(--blob-2), transparent 62%),radial-gradient(900px 900px at 40% 115%, var(--blob-3), transparent 60%);
  filter:blur(60px);}
.main{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:20px 20px 110px;display:flex;flex-direction:column;gap:18px;}

.topnav{display:flex;align-items:center;justify-content:space-between;padding:4px 2px;}
.topnav-title{font-family:'Anton',sans-serif;font-size:21px;letter-spacing:1.2px;
  background:linear-gradient(100deg, var(--text) 45%, var(--gold-light) 130%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}
.nav-circle-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass-grad);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);box-shadow:var(--glass-shadow);display:grid;place-items:center;color:var(--text2);cursor:pointer;text-decoration:none;transition:all var(--transition);flex-shrink:0;}
.nav-circle-btn:hover{color:var(--gold);transform:translateY(-1px);}
.nav-circle-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;}

.page{display:none;flex-direction:column;gap:16px;}
.page.active{display:flex;}

.card{background:var(--glass-grad);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--glass-border);border-radius:var(--radius-card);padding:20px;box-shadow:var(--glass-shadow);}
.card-title{font-family:'Anton',sans-serif;font-size:14px;letter-spacing:.6px;color:var(--text2);margin-bottom:12px;text-transform:uppercase;}
.brief-text{font-size:14px;line-height:1.6;color:var(--text);}
.profile-line{font-size:11.5px;color:var(--text3);margin-top:10px;}
.profile-line a{color:var(--gold);text-decoration:none;font-weight:600;}

.deadline-row, .match-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--divider);}
.deadline-row:last-child, .match-row:last-child{border-bottom:none;}
.dl-title{font-size:13px;font-weight:600;color:var(--text);}
.dl-org{font-size:11px;color:var(--text3);}
.dl-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:var(--radius-pill);background:var(--down-bg);color:var(--down);white-space:nowrap;}
.match-badge{font-family:'Anton',sans-serif;font-size:15px;color:var(--gold);}
.empty-line{font-size:12.5px;color:var(--text3);padding:6px 0;}

.pill-row{display:flex;gap:6px;flex-wrap:wrap;}
.pill{padding:6px 13px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--divider);background:var(--bg3);color:var(--text2);transition:all var(--transition);}
.pill.active{background:var(--badge-bg);color:var(--text);border-color:transparent;}

.opp-grid{display:flex;flex-direction:column;gap:12px;}
.opp-card{background:var(--glass-grad);border:1px solid var(--glass-border);border-radius:18px;padding:18px 20px;box-shadow:var(--glass-shadow);display:flex;flex-direction:column;gap:10px;}
.opp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.opp-title{font-size:15px;font-weight:700;color:var(--text);line-height:1.35;}
.opp-org{font-size:12px;color:var(--text2);margin-top:2px;}
.opp-score{flex-shrink:0;text-align:center;padding:6px 12px;border-radius:12px;background:var(--gold-bg);}
.opp-score-num{font-family:'Anton',sans-serif;font-size:18px;color:var(--gold);}
.opp-score-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;}
.opp-meta{display:flex;gap:8px;flex-wrap:wrap;}
.tag{font-size:11px;font-weight:600;padding:3px 10px;border-radius:var(--radius-pill);background:var(--badge-bg);color:var(--text2);}
.tag.deadline-soon{background:var(--down-bg);color:var(--down);}
.tag.deadline-ok{background:var(--up-bg);color:var(--up);}
.opp-desc{font-size:12.5px;color:var(--text2);line-height:1.55;}
.opp-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:8px;border-top:1px solid var(--divider);}
.opp-link{font-size:12px;font-weight:600;color:var(--gold);text-decoration:none;}
.opp-actions{display:flex;gap:8px;}
.opp-actions button{font-size:11px;padding:6px 13px;border-radius:var(--radius-pill);border:1px solid var(--glass-border);background:transparent;color:var(--text2);cursor:pointer;transition:all var(--transition);}
.opp-actions button.save:hover{color:var(--up);border-color:var(--up);}
.opp-actions button.apply:hover{color:var(--gold);border-color:var(--gold);}
.opp-actions button.dismiss:hover{color:var(--down);border-color:var(--down);}
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:13px;}

/* Bottom tab bar — same pattern as Axe Finance */
.bottom-nav{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:6px;background:var(--glass-grad);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border:1px solid var(--glass-border);border-radius:var(--radius-pill);box-shadow:var(--glass-shadow);z-index:150;}
.bnav-item{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:var(--text3);cursor:pointer;text-decoration:none;transition:all var(--transition);-webkit-tap-highlight-color:transparent;position:relative;}
.bnav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;transition:transform var(--transition);}
.bnav-item span.emoji{font-size:19px;}
.bnav-item:hover{color:var(--text2);}
.bnav-item.active{background:linear-gradient(150deg,var(--gold-light),var(--gold-deep));color:#f4f8ff;box-shadow:0 6px 18px -4px var(--gold-glow);}
.bnav-item.active svg{transform:scale(1.06);stroke-width:2;}

/* FAB — log an opportunity manually */
.fab-add{position:fixed;right:18px;bottom:22px;width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;display:grid;place-items:center;background:linear-gradient(150deg,var(--gold-light),var(--gold-deep));box-shadow:0 12px 30px -8px var(--gold-glow), inset 0 1px 0 rgba(255,255,255,.45);z-index:155;-webkit-tap-highlight-color:transparent;}
.fab-add svg{width:24px;height:24px;stroke:#f4f8ff;fill:none;stroke-width:2.3;}

/* Manual-add modal */
.qa-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:center;justify-content:center;padding:20px;}
.qa-overlay.open{display:flex;}
.qa-modal{background:var(--glass-bg-strong);backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);border:1px solid var(--glass-border);border-radius:var(--radius-card);box-shadow:var(--glass-shadow-hover);width:100%;max-width:400px;max-height:90vh;overflow-y:auto;}
.qa-modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--divider);}
.qa-modal-title{font-family:'Anton',sans-serif;font-size:15px;letter-spacing:.5px;color:var(--text);}
.qa-modal-close{width:28px;height:28px;border-radius:50%;border:1px solid var(--divider);background:transparent;color:var(--text2);display:grid;place-items:center;cursor:pointer;}
.qa-modal-close svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;}
.qa-modal-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px;}
.qa-field label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:6px;}
.qa-field input, .qa-field select, .qa-field textarea{width:100%;padding:11px 14px;border:1.5px solid var(--glass-border);border-radius:12px;background:var(--glass-bg);color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;}
.qa-field input:focus, .qa-field select:focus, .qa-field textarea:focus{border-color:var(--gold-border);}
.qa-submit-btn{width:100%;padding:13px;border:none;border-radius:12px;background:var(--nav-bg);color:var(--nav-text);font-size:14px;font-weight:600;cursor:pointer;}

/* AI chat tab */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:340px;}
.chat-area{flex:1;overflow-y:auto;padding:4px 2px;display:flex;flex-direction:column;gap:14px;}
.msg{display:flex;gap:9px;}
.msg.user{flex-direction:row-reverse;}
.msg-avatar{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;font-size:14px;align-self:flex-end;}
.msg.axe .msg-avatar{background:linear-gradient(150deg,var(--gold-light),var(--gold-deep));box-shadow:0 4px 12px -4px var(--gold-glow);}
.msg.user .msg-avatar{background:var(--glass-grad);border:1px solid var(--glass-border);color:var(--text2);}
.msg-bubble{max-width:80%;padding:9px 13px;border-radius:15px;font-size:13.5px;line-height:1.55;}
.msg.axe .msg-bubble{background:var(--glass-grad);border:1px solid var(--glass-border);color:var(--text);border-bottom-left-radius:4px;}
.msg.user .msg-bubble{background:linear-gradient(150deg,var(--gold-light),var(--gold-deep));color:#f4f8ff;border-bottom-right-radius:4px;}
.chat-input-row{display:flex;gap:8px;margin-top:10px;}
.chat-input-row textarea{flex:1;background:var(--glass-bg);border:1.5px solid var(--glass-border);border-radius:14px;padding:12px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;resize:none;outline:none;height:46px;max-height:100px;}
.chat-send-btn{width:46px;height:46px;border-radius:14px;background:linear-gradient(150deg,var(--gold-light),var(--gold-deep));border:none;cursor:pointer;display:grid;place-items:center;flex-shrink:0;}
.chat-send-btn svg{width:17px;height:17px;stroke:#f4f8ff;fill:none;stroke-width:2;}

@media(max-width:640px){ .main{padding:14px 14px 100px;} }
</style>
</head>
<body>

<div class="main">
  <nav class="topnav">
    <a class="nav-circle-btn" href="/home" title="Axe Home">
      <svg viewBox="0 0 24 24"><polyline points="15,18 9,12 15,6"/></svg>
    </a>
    <span class="topnav-title" id="pgtitle">DASHBOARD</span>
    <span style="width:40px;"></span>
  </nav>

  <!-- DASHBOARD -->
  <div class="page active" id="page-dashboard">
    <div class="card">
      <div class="card-title">Today's Brief</div>
      <div class="brief-text" id="briefText">Loading…</div>
      <div class="profile-line" id="profileLine"></div>
    </div>
    <div class="card">
      <div class="card-title">Deadlines</div>
      <div id="deadlineList"></div>
    </div>
    <div class="card">
      <div class="card-title">AI Suggestions</div>
      <div id="suggestList"></div>
    </div>
  </div>

  <!-- OPPORTUNITIES -->
  <div class="page" id="page-opportunities">
    <div class="pill-row" id="typeFilters">
      <div class="pill active" data-type="">All</div>
      <div class="pill" data-type="open_call">Open Calls</div>
      <div class="pill" data-type="job">Jobs</div>
      <div class="pill" data-type="grant">Grants</div>
    </div>
    <div class="opp-grid" id="oppGrid"></div>
  </div>

  <!-- APPLICATIONS -->
  <div class="page" id="page-applications">
    <div class="opp-grid" id="applicationsGrid"></div>
  </div>

  <!-- AI -->
  <div class="page" id="page-ai">
    <div class="chat-wrap">
      <div class="chat-area" id="chatArea"></div>
      <div class="chat-input-row">
        <textarea id="chatInput" placeholder="Ask about your opportunities, an application, a statement…" rows="1"></textarea>
        <button class="chat-send-btn" id="chatSendBtn">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22,2 15,22 11,13 2,9"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<nav class="bottom-nav" id="bottomNav">
  <a class="bnav-item active" href="#" data-page="page-dashboard" title="Dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
  </a>
  <a class="bnav-item" href="#" data-page="page-opportunities" title="Opportunities">
    <span class="emoji">🚀</span>
  </a>
  <a class="bnav-item" href="#" data-page="page-applications" title="Applications">
    <span class="emoji">📄</span>
  </a>
  <a class="bnav-item" href="#" data-page="page-ai" title="AI">
    <span class="emoji">🪓</span>
  </a>
</nav>

<button class="fab-add" id="fabAddBtn" title="Log an opportunity">
  <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<div class="qa-overlay" id="manualOverlay">
  <div class="qa-modal">
    <div class="qa-modal-header">
      <div class="qa-modal-title">LOG AN OPPORTUNITY</div>
      <button class="qa-modal-close" id="manualCloseBtn"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="qa-modal-body">
      <div class="qa-field"><label>Title</label><input type="text" id="manTitle" placeholder="e.g. Guest Curator — Bangkok Biennale"></div>
      <div class="qa-field"><label>Type</label>
        <select id="manType"><option value="open_call">Open Call</option><option value="job">Job</option><option value="grant">Grant</option></select>
      </div>
      <div class="qa-field"><label>Organization</label><input type="text" id="manOrg" placeholder="Optional"></div>
      <div class="qa-field"><label>Link</label><input type="text" id="manUrl" placeholder="Optional"></div>
      <div class="qa-field"><label>Deadline</label><input type="date" id="manDeadline"></div>
      <div class="qa-field"><label>Notes</label><textarea id="manDesc" rows="2" placeholder="Optional"></textarea></div>
      <button class="qa-submit-btn" id="manSubmitBtn">Add</button>
    </div>
  </div>
</div>

<script>
var $ = function(id){ return document.getElementById(id); };
async function fetchJSON(url, opts){ var res = await fetch(url, opts); return res.json(); }

// ── TAB NAVIGATION ────────────────────────────────────────────────────────
var TITLES = {'page-dashboard':'DASHBOARD','page-opportunities':'OPPORTUNITIES','page-applications':'APPLICATIONS','page-ai':'AI'};
function navigate(pageId){
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  $(pageId).classList.add('active');
  document.querySelectorAll('.bnav-item').forEach(function(i){ i.classList.remove('active'); });
  document.querySelector('.bnav-item[data-page="'+pageId+'"]').classList.add('active');
  $('pgtitle').textContent = TITLES[pageId];
  if (pageId === 'page-dashboard') loadDashboard();
  else if (pageId === 'page-opportunities') loadOpportunities();
  else if (pageId === 'page-applications') loadApplications();
}
document.querySelectorAll('.bnav-item').forEach(function(link){
  link.addEventListener('click', function(e){ e.preventDefault(); navigate(this.dataset.page); });
});

// ── DEADLINE FORMATTING ───────────────────────────────────────────────────
function fmtDeadline(d){
  if(!d) return null;
  var dt = new Date(d + 'T00:00:00');
  var days = Math.round((dt - new Date()) / 86400000);
  var label = dt.toLocaleDateString('en-US', {month:'short', day:'numeric'});
  return { label: label, days: days };
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────
async function loadDashboard(){
  try {
    var s = await fetchJSON('/api/career/dashboard-summary');
    var profile = await fetchJSON('/api/career/profile');

    var lastSearch = s.last_search_at ? new Date(s.last_search_at + 'Z').toLocaleString('en-US', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) : 'not yet run';
    $('briefText').innerHTML = `You have <strong>${s.total_active}</strong> active opportunit${s.total_active===1?'y':'ies'}.` +
      (s.upcoming_deadlines.length ? ` Nearest deadline: <strong>${s.upcoming_deadlines[0].title}</strong>.` : ' No deadlines on file yet.') +
      ` Axe last checked for new ones: ${lastSearch}.`;

    $('profileLine').innerHTML = profile
      ? `Searching as: <strong>${profile.specialty}</strong> — ${profile.location || 'no location set'}`
      : '';

    if (s.upcoming_deadlines.length) {
      $('deadlineList').innerHTML = s.upcoming_deadlines.map(function(o){
        var d = fmtDeadline(o.deadline);
        return `<div class="deadline-row"><div><div class="dl-title">${o.title}</div><div class="dl-org">${o.org||''}</div></div><span class="dl-badge">${d.days}d</span></div>`;
      }).join('');
    } else {
      $('deadlineList').innerHTML = '<div class="empty-line">No deadlines on file yet.</div>';
    }

    if (s.top_matches.length) {
      $('suggestList').innerHTML = s.top_matches.map(function(o){
        return `<div class="match-row"><div><div class="dl-title">${o.title}</div><div class="dl-org">${o.org||''}</div></div><span class="match-badge">${Math.round(o.match_score||0)}</span></div>`;
      }).join('');
    } else {
      $('suggestList').innerHTML = '<div class="empty-line">Nothing scored yet — check back after the next search.</div>';
    }
  } catch (err) {
    $('briefText').textContent = "Couldn't load: " + err.message;
  }
}

// ── OPPORTUNITIES ─────────────────────────────────────────────────────────
var currentTypeFilter = '';
function oppCardHtml(o, showApply){
  var deadlineInfo = fmtDeadline(o.deadline);
  var deadlineTag = deadlineInfo
    ? `<span class="tag ${deadlineInfo.days <= 7 ? 'deadline-soon' : 'deadline-ok'}">${deadlineInfo.days < 0 ? 'Deadline passed' : ('Due ' + deadlineInfo.label + ' (' + deadlineInfo.days + 'd)')}</span>`
    : '<span class="tag">No deadline listed</span>';
  var typeLabels = {open_call: 'Open Call', job: 'Job', grant: 'Grant'};
  var scoreHtml = o.match_score
    ? `<div class="opp-score"><div class="opp-score-num">${Math.round(o.match_score)}</div><div class="opp-score-lbl">match</div></div>`
    : `<div class="opp-score"><div class="opp-score-lbl" style="font-size:10px;">Added<br>manually</div></div>`;
  return `
    <div class="opp-card" data-id="${o.id}">
      <div class="opp-head">
        <div><div class="opp-title">${o.title}</div>${o.org ? '<div class="opp-org">' + o.org + '</div>' : ''}</div>
        ${scoreHtml}
      </div>
      <div class="opp-meta"><span class="tag">${typeLabels[o.type] || o.type}</span>${deadlineTag}</div>
      ${o.description ? '<div class="opp-desc">' + o.description.slice(0, 220) + (o.description.length > 220 ? '…' : '') + '</div>' : ''}
      <div class="opp-foot">
        ${o.url && !o.url.startsWith('manual://') ? `<a class="opp-link" href="${o.url}" target="_blank" rel="noopener">View source ↗</a>` : '<span></span>'}
        <div class="opp-actions">
          ${showApply ? '<button class="apply" onclick="setStatus(' + o.id + ', \\'applied\\')">Applied</button>' : ''}
          <button class="save" onclick="setStatus(${o.id}, 'saved')">Save</button>
          <button class="dismiss" onclick="setStatus(${o.id}, 'dismissed')">Dismiss</button>
        </div>
      </div>
    </div>`;
}

async function loadOpportunities(){
  var url = '/api/career/opportunities?status=new,saved' + (currentTypeFilter ? '&type=' + currentTypeFilter : '');
  var data = await fetchJSON(url);
  $('oppGrid').innerHTML = data.length ? data.map(function(o){ return oppCardHtml(o, true); }).join('') : '<div class="empty">No opportunities yet — Axe checks automatically every day.</div>';
}
document.querySelectorAll('#typeFilters .pill').forEach(function(p){
  p.addEventListener('click', function(){
    document.querySelectorAll('#typeFilters .pill').forEach(function(x){ x.classList.remove('active'); });
    this.classList.add('active');
    currentTypeFilter = this.dataset.type;
    loadOpportunities();
  });
});

async function setStatus(id, status){
  await fetchJSON('/api/career/opportunities/' + id + '/status', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({status: status})
  });
  loadOpportunities();
  loadApplications();
  loadDashboard();
}

// ── APPLICATIONS ──────────────────────────────────────────────────────────
async function loadApplications(){
  var data = await fetchJSON('/api/career/opportunities?status=applied');
  $('applicationsGrid').innerHTML = data.length ? data.map(function(o){ return oppCardHtml(o, false); }).join('') : '<div class="empty">Nothing marked as applied yet — tap "Applied" on an opportunity to track it here.</div>';
}

// ── MANUAL ADD (FAB) ──────────────────────────────────────────────────────
$('fabAddBtn').addEventListener('click', function(){ $('manualOverlay').classList.add('open'); });
$('manualCloseBtn').addEventListener('click', function(){ $('manualOverlay').classList.remove('open'); });
$('manualOverlay').addEventListener('click', function(e){ if (e.target === this) this.classList.remove('open'); });
$('manSubmitBtn').addEventListener('click', async function(){
  var title = $('manTitle').value.trim();
  if (!title) { alert('Title is required.'); return; }
  await fetchJSON('/api/career/opportunities/manual', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      title: title, type: $('manType').value, org: $('manOrg').value,
      url: $('manUrl').value, deadline: $('manDeadline').value, description: $('manDesc').value
    })
  });
  $('manualOverlay').classList.remove('open');
  $('manTitle').value=''; $('manOrg').value=''; $('manUrl').value=''; $('manDeadline').value=''; $('manDesc').value='';
  loadOpportunities();
  loadDashboard();
});

// ── AI CHAT ───────────────────────────────────────────────────────────────
var chatHistory = [];
function getTime(){ return new Date().toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'}); }
function fmtChat(t){ return t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>'); }
function appendChatMsg(role, text){
  var area = $('chatArea');
  var div = document.createElement('div');
  div.className = 'msg ' + (role === 'axe' ? 'axe' : 'user');
  div.innerHTML = role === 'axe'
    ? `<div class="msg-avatar">🪓</div><div class="msg-bubble">${fmtChat(text)}</div>`
    : `<div class="msg-avatar">M</div><div class="msg-bubble">${text}</div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}
if ($('chatArea').children.length === 0) {
  appendChatMsg('axe', "Hey Mike — ask me about your opportunities, an application strategy, or a curatorial statement draft.");
}
async function sendChat(){
  var input = $('chatInput');
  var text = input.value.trim();
  if (!text) return;
  input.value = '';
  appendChatMsg('user', text);
  chatHistory.push({role:'user', content:text});
  if (chatHistory.length > 10) chatHistory = chatHistory.slice(-10);
  try {
    var data = await fetchJSON('/api/career-chat', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({messages: chatHistory})
    });
    var reply = data.reply || 'Sorry, I hit an error.';
    chatHistory.push({role:'assistant', content:reply});
    appendChatMsg('axe', reply);
  } catch (err) {
    appendChatMsg('axe', 'Error: ' + err.message);
  }
}
$('chatSendBtn').addEventListener('click', sendChat);
$('chatInput').addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); } });

// ── INIT ──────────────────────────────────────────────────────────────────
loadDashboard();
</script>
