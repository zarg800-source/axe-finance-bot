<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Axe</title>
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Axe">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<script>
(function(){
  var s=localStorage.getItem("mf-theme");
  var sys=window.matchMedia("(prefers-color-scheme:dark)").matches;
  document.documentElement.setAttribute("data-theme", s||(sys?"dark":"light"));
})();
</script>
<meta name="theme-color" content="#1d1d1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ── TOKENS — identical to dashboard.html, do not fork ─────────────── */
:root {
  --radius-card: 22px;
  --radius-pill: 999px;
  --transition: .22s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"] {
  --bg:        #f5f5f7;
  --bg2:       #ffffff;
  --bg3:       #fafafa;
  --nav-bg:    #1d1d1f;
  --nav-text:  #fff;
  --nav-sub:   rgba(255,255,255,.65);
  --card-bg:   #ffffff;
  --card-border: rgba(0,0,0,.06);
  --text:      #1d1d1f;
  --text2:     #6e6e73;
  --text3:     #aeaeb2;
  --divider:   rgba(0,0,0,.06);
  --badge-bg:  #f5f5f7;
  --glass-grad: linear-gradient(165deg, rgba(255,255,255,.62), rgba(255,255,255,.34));
  --glass-bg:        rgba(255,255,255,.44);
  --glass-bg-strong: rgba(255,255,255,.78);
  --glass-border:    rgba(255,255,255,.55);
  --glass-shadow:
    inset 0 1px 0 rgba(255,255,255,.85),
    inset 0 0 0 1px rgba(255,255,255,.18),
    0 1px 2px rgba(30,32,60,.04),
    0 18px 40px -16px rgba(30,32,60,.16);
  --glass-shadow-hover:
    inset 0 1px 0 rgba(255,255,255,.9),
    inset 0 0 0 1px rgba(255,255,255,.22),
    0 24px 48px -16px rgba(30,32,60,.22);
  --blob-1: rgba(30,41,90,.08);
  --blob-2: rgba(70,130,200,.09);
  --blob-3: rgba(16,110,80,.06);
  --gold:       #3763a8;
  --gold-light: #6f97d6;
  --gold-deep:  #2a4d85;
  --gold-border: rgba(55,99,168,.35);
  --gold-glow:  rgba(55,99,168,.35);
  --gold-bg:    rgba(55,99,168,.10);
}
[data-theme="dark"] {
  --bg:        #000000;
  --bg2:       #1c1c1e;
  --bg3:       #2c2c2e;
  --nav-bg:    #f5f5f7;
  --nav-text:  #1d1d1f;
  --nav-sub:   rgba(0,0,0,.55);
  --card-bg:   #1c1c1e;
  --card-border: rgba(255,255,255,.08);
  --text:      #f5f5f7;
  --text2:     #aeaeb2;
  --text3:     #636366;
  --divider:   rgba(255,255,255,.08);
  --badge-bg:  rgba(255,255,255,.1);
  --glass-grad: linear-gradient(165deg, rgba(255,255,255,.10), rgba(255,255,255,.025));
  --glass-bg:        rgba(255,255,255,.055);
  --glass-bg-strong: rgba(35,35,40,.82);
  --glass-border:    rgba(255,255,255,.10);
  --glass-shadow:
    inset 0 1px 0 rgba(255,255,255,.09),
    inset 0 0 0 1px rgba(255,255,255,.05),
    0 1px 2px rgba(0,0,0,.3),
    0 24px 48px -16px rgba(0,0,0,.55);
  --glass-shadow-hover:
    inset 0 1px 0 rgba(255,255,255,.12),
    inset 0 0 0 1px rgba(255,255,255,.07),
    0 28px 56px -16px rgba(0,0,0,.65);
  --blob-1: rgba(24,34,84,.55);
  --blob-2: rgba(70,150,220,.16);
  --blob-3: rgba(16,110,80,.16);
  --gold:       #7fa8e8;
  --gold-light: #a9c6f2;
  --gold-deep:  #5683c9;
  --gold-border: rgba(127,168,232,.35);
  --gold-glow:  rgba(127,168,232,.45);
  --gold-bg:    rgba(127,168,232,.12);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100vw}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  position:relative;
  transition:background var(--transition),color var(--transition);
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:-10%;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(1100px 900px at 12% -10%, var(--blob-1), transparent 60%),
    radial-gradient(1000px 800px at 108% 10%, var(--blob-2), transparent 62%),
    radial-gradient(900px 900px at 40% 115%, var(--blob-3), transparent 60%);
  filter:blur(60px);
}
body::after{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  opacity:.035;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  background-size:120px 120px;
}
[data-theme="dark"] body::after{opacity:.05}

.main{
  position:relative;z-index:1;
  max-width:1180px;margin:0 auto;
  padding:24px 28px 60px;
  display:flex;flex-direction:column;gap:22px;
}

/* ── TOP BAR ─────────────────────────────────────────────── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 2px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(150deg,var(--gold-light),var(--gold-deep));
  display:grid;place-items:center;box-shadow:0 4px 14px -4px var(--gold-glow);
  flex-shrink:0;
}
.brand-mark span{font-family:'Anton',sans-serif;font-size:15px;color:#f4f8ff;}
.brand-name{font-family:'Anton',sans-serif;font-size:16px;letter-spacing:1.2px;color:var(--text);}
.nav-circle-btn{
  width:40px;height:40px;border-radius:50%;
  border:1px solid var(--glass-border);
  background:var(--glass-grad);
  backdrop-filter:blur(20px) saturate(150%);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  box-shadow:var(--glass-shadow);
  display:grid;place-items:center;color:var(--text2);cursor:pointer;
  text-decoration:none;transition:all var(--transition);flex-shrink:0;
}
.nav-circle-btn:hover{color:var(--gold);transform:translateY(-1px);}
.nav-circle-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;}

/* ── GREETING ────────────────────────────────────────────── */
.greeting-block{padding:6px 2px 2px;}
.greeting{
  font-family:'Anton',sans-serif;font-size:28px;letter-spacing:.5px;
  background:linear-gradient(100deg, var(--text) 45%, var(--gold-light) 140%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  margin-bottom:4px;
}
.greeting-sub{font-size:13px;color:var(--text2);}

/* ── AI SEARCH BAR ───────────────────────────────────────── */
.ai-search{
  display:flex;align-items:center;gap:10px;
  padding:6px 8px 6px 18px;
  background:var(--glass-grad);
  backdrop-filter:blur(24px) saturate(150%);
  -webkit-backdrop-filter:blur(24px) saturate(150%);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-pill);
  box-shadow:var(--glass-shadow);
}
.ai-search svg{width:17px;height:17px;stroke:var(--text3);fill:none;stroke-width:2;flex-shrink:0;}
.ai-search input{
  flex:1;border:none;background:none;outline:none;
  font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);
  height:26px;
}
.ai-search input::placeholder{color:var(--text3);}
.ai-search button{
  flex-shrink:0;padding:9px 18px;border:none;border-radius:var(--radius-pill);
  background:linear-gradient(150deg,var(--gold-light),var(--gold-deep));
  color:#f4f8ff;font-size:12.5px;font-weight:600;font-family:'DM Sans',sans-serif;
  cursor:pointer;transition:opacity var(--transition);
}
.ai-search button:hover{opacity:.9;}
.ai-note{
  font-size:11.5px;color:var(--text3);padding:2px 16px 0;min-height:16px;
}

/* ── BENTO GRID ──────────────────────────────────────────── */
.bento{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:16px;
}
.tile{
  grid-column:span 2;
  background:var(--glass-grad);
  backdrop-filter:blur(20px) saturate(150%);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-card);
  padding:22px;
  box-shadow:var(--glass-shadow);
  position:relative;overflow:hidden;
  text-decoration:none;color:inherit;
  display:flex;flex-direction:column;justify-content:space-between;
  min-height:140px;
  transition:transform var(--transition), box-shadow var(--transition);
  cursor:pointer;
}
.tile:hover{transform:translateY(-3px);box-shadow:var(--glass-shadow-hover);}
.tile.dim{opacity:.55;}
.tile.dim .tile-label{color:var(--text2);}
.tile.primary{
  grid-column:span 4;
  min-height:150px;
  background:linear-gradient(165deg, color-mix(in srgb, var(--nav-bg) 92%, transparent) 0%, color-mix(in srgb, var(--nav-bg) 78%, transparent) 100%);
  border-color:var(--gold-border);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.16),
    inset 0 0 0 1px var(--gold-border),
    0 1px 2px rgba(0,0,0,.2),
    0 20px 44px -16px rgba(0,0,0,.35);
}
.tile.primary::after{
  content:'';position:absolute;top:-30%;right:-6%;width:220px;height:220px;border-radius:50%;
  background:rgba(255,255,255,.08);
}
.tile::before{
  content:'';position:absolute;bottom:-18px;right:-18px;width:80px;height:80px;border-radius:50%;
  background:var(--badge-bg);
}
.tile.primary::before{display:none;}
.tile-icon-wrap{
  width:42px;height:42px;border-radius:12px;
  background:var(--badge-bg);
  display:grid;place-items:center;margin-bottom:14px;position:relative;z-index:1;
}
.tile.primary .tile-icon-wrap{background:rgba(255,255,255,.2);}
.tile-icon-wrap svg{width:20px;height:20px;stroke:var(--text2);fill:none;stroke-width:1.8;}
.tile.primary .tile-icon-wrap svg{stroke:var(--gold-light);}
.tile-label{
  font-family:'Anton',sans-serif;font-size:16px;letter-spacing:.6px;color:var(--text);
  position:relative;z-index:1;
}
.tile.primary .tile-label{color:var(--nav-text);font-size:19px;}
.tile-sub{font-size:12px;color:var(--text3);margin-top:4px;position:relative;z-index:1;}
.tile.primary .tile-sub{color:var(--nav-sub);}
.tile-status{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10.5px;font-weight:600;letter-spacing:.3px;
  padding:3px 9px;border-radius:var(--radius-pill);
  background:var(--badge-bg);color:var(--text3);
  margin-top:10px;align-self:flex-start;position:relative;z-index:1;
}
.tile.primary .tile-status{background:rgba(255,255,255,.18);color:var(--nav-sub);}
.tile-status.live{color:var(--up,#34c759);}
.tile-status::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;}

@media(max-width:900px){
  .main{padding:16px 14px 50px;}
  .bento{grid-template-columns:repeat(2, 1fr);}
  .tile{grid-column:span 1;}
  .tile.primary{grid-column:span 2;}
  .greeting{font-size:22px;}
}
@media(max-width:480px){
  .bento{gap:12px;}
  .tile{padding:16px;min-height:120px;}
  .tile-icon-wrap{width:36px;height:36px;margin-bottom:10px;}
}

.skeleton{opacity:.5;}

.ai-command-center{display:flex;flex-direction:column;gap:10px}.ai-prompt-row{display:flex;flex-wrap:wrap;gap:8px}.ai-prompt-row button{border:1px solid var(--glass-border);background:var(--glass-bg);color:var(--text2);border-radius:999px;padding:8px 12px;font:500 12px 'DM Sans',sans-serif;cursor:pointer;transition:transform .18s ease,background .18s ease,color .18s ease}.ai-prompt-row button:hover{transform:translateY(-1px);background:var(--glass-bg-strong);color:var(--text)}.ai-response{display:none;padding:14px 16px;border:1px solid var(--glass-border);border-radius:16px;background:var(--glass-bg-strong);color:var(--text2);font-size:13px;line-height:1.55;box-shadow:var(--glass-shadow)}.ai-response.open{display:block}.ai-response strong{color:var(--text)}.ai-response .ai-response-label{display:flex;align-items:center;gap:8px;color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.4px;margin-bottom:6px}.ai-response .ai-response-label span{width:6px;height:6px;border-radius:50%;background:var(--up)}

/* Shared Axe shell controls */
.axe-global-actions{position:fixed;right:24px;top:20px;display:flex;align-items:center;gap:9px;z-index:300}.axe-global-actions a{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;text-decoration:none;color:var(--text2,#6e6e73);background:var(--glass-bg,rgba(255,255,255,.7));border:1px solid var(--glass-border,rgba(255,255,255,.8));box-shadow:var(--glass-shadow,0 12px 28px -16px rgba(30,34,45,.3));font-size:16px}.axe-global-actions a:hover{color:var(--gold,#315f9f);transform:translateY(-1px)}.axe-global-actions .axe-profile{background:linear-gradient(150deg,var(--gold-light,#6f97d6),var(--gold-deep,#2a4d85));color:#fff;border-color:transparent;font-size:13px;font-weight:600}.axe-global-nav{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:6px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid var(--glass-border,rgba(255,255,255,.8));box-shadow:0 14px 35px -18px rgba(30,34,45,.4);backdrop-filter:blur(20px);z-index:290}.axe-global-nav a{width:46px;height:46px;display:grid;place-items:center;border-radius:50%;text-decoration:none;color:var(--text3,#aeaeb2);font-size:18px;transition:all .18s ease}.axe-global-nav a:hover,.axe-global-nav a.active{background:linear-gradient(150deg,var(--gold-light,#6f97d6),var(--gold-deep,#2a4d85));color:#fff;box-shadow:0 7px 18px -7px var(--gold,#315f9f)}@media(max-width:620px){.axe-global-actions{right:14px;top:14px}.axe-global-actions a{width:34px;height:34px}.axe-global-nav{bottom:14px}.axe-global-nav a{width:42px;height:42px}}

/* Interactive Axe space selector */
.axe-global-nav,.bottom-nav{transition:box-shadow .18s ease,background .18s ease}.axe-global-nav.axe-selector-open,.bottom-nav.axe-selector-open{box-shadow:0 18px 40px -18px rgba(30,34,45,.55)}
.axe-selector-toggle{width:46px;height:46px;border:0;border-radius:50%;display:grid;place-items:center;background:linear-gradient(150deg,var(--gold-light,#6f97d6),var(--gold-deep,#2a4d85));color:#fff;font-size:18px;cursor:pointer;box-shadow:0 7px 18px -7px var(--gold,#315f9f);transition:transform .18s ease}.axe-selector-toggle:active{transform:scale(.96)}.axe-selector-toggle:focus-visible,.axe-selector-link:focus-visible{outline:3px solid rgba(111,151,214,.45);outline-offset:3px}.axe-selector-link{position:relative}.axe-selector-link::after{content:attr(data-label);position:absolute;left:50%;bottom:calc(100% + 10px);transform:translate(-50%,4px);opacity:0;pointer-events:none;white-space:nowrap;padding:6px 9px;border-radius:8px;background:var(--text,#1d1d1f);color:var(--bg,#f5f5f7);font:600 10px 'DM Sans',sans-serif;letter-spacing:.2px;transition:opacity .16s ease,transform .16s ease}.axe-selector-link:hover::after,.axe-selector-link:focus-visible::after{opacity:1;transform:translate(-50%,0)}
.axe-global-nav:not(.axe-selector-open) .axe-selector-link,.bottom-nav:not(.axe-selector-open) .axe-selector-link{display:none}.axe-global-nav.axe-selector-open .axe-selector-link,.bottom-nav.axe-selector-open .axe-selector-link{display:grid}.axe-selector-helper{position:fixed;left:50%;bottom:86px;transform:translate(-50%,4px);opacity:0;pointer-events:none;padding:7px 10px;border-radius:9px;background:var(--text,#1d1d1f);color:var(--bg,#f5f5f7);font:500 10px 'DM Sans',sans-serif;transition:opacity .16s ease,transform .16s ease;z-index:301}.axe-selector-helper.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.axe-selector-toggle,.axe-selector-link::after,.axe-selector-helper{transition:none}}
</style>
</head>
<body>

<main class="main">
  <nav class="topbar">
    <div class="brand">
      <div class="brand-mark"><span>🪓</span></div>
      <div class="brand-name">AXE</div>
    </div>
    <a class="nav-circle-btn" href="/logout" title="Sign out">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </a>
  </nav>

  <div class="greeting-block">
    <div class="greeting" id="greeting">Good day</div>
    <div class="greeting-sub" id="dateLine"></div>
  </div>

  <div class="ai-command-center">
    <div class="ai-search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="aiSearchInput" placeholder="Ask Axe anything…" autocomplete="off">
      <button id="aiSearchBtn" type="button">Ask</button>
    </div>
    <div class="ai-prompt-row" id="aiPromptRow">
      <button type="button" data-prompt="Can I afford this trip?">Can I afford this trip?</button>
      <button type="button" data-prompt="What career opportunities should I review today?">Career opportunities</button>
      <button type="button" data-prompt="What should I focus on today?">Today's focus</button>
    </div>
    <div class="ai-response" id="aiResponse" aria-live="polite"></div>
  </div>

  <div class="bento" id="bentoGrid">
    <!-- Tiles injected by JS from /api/spaces -->
  </div>
</main>

<script>
var $ = function(id){ return document.getElementById(id); };

// ── Greeting ──────────────────────────────────────────────
(function(){
  var h = new Date().getHours();
  var text = h < 5 ? 'Still up, Mike?' : h < 12 ? 'Good morning, Mike' : h < 18 ? 'Good afternoon, Mike' : 'Good evening, Mike';
  $('greeting').textContent = text;
  $('dateLine').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
})();

// ── Global Axe command center ────────────────────────────────────────────────
var globalAiBusy = false;
function globalAiRoute(query){
  var q = query.toLowerCase();
  if (/career|job|fellowship|application|opportunit|deadline|resume|cv/.test(q)) return {endpoint:'/api/career-chat', label:'CAREER AXE'};
  if (/money|finance|afford|budget|spend|saving|expense|income|account|trip|travel budget/.test(q)) return {endpoint:'/api/cfo-chat', label:'FINANCE AXE'};
  return {endpoint:'/api/career-chat', label:'AXE'};
}
function safeGlobalText(value){return String(value||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c];}).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');}
async function askGlobalAxe(){
  var input=$('aiSearchInput'), button=$('aiSearchBtn'), response=$('aiResponse'), query=input.value.trim();
  if(!query||globalAiBusy)return;
  var route=globalAiRoute(query);globalAiBusy=true;button.disabled=true;button.textContent='…';response.className='ai-response open';response.innerHTML='<div class="ai-response-label"><span></span>'+route.label+'</div>Thinking through that…';
  try{
    var r=await fetch(route.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:query}]})});
    var data=await r.json();if(!r.ok)throw new Error(data.error||data.reply||'Server error');
    response.innerHTML='<div class="ai-response-label"><span></span>'+route.label+'</div>'+safeGlobalText(data.reply||'I could not generate a response yet.');
  }catch(e){response.innerHTML='<div class="ai-response-label"><span></span>AXE</div>I could not reach the selected agent right now. Try again in a moment.';console.error('Global Axe error:',e);}
  finally{globalAiBusy=false;button.disabled=false;button.textContent='Ask';}
}
$('aiSearchBtn').addEventListener('click',askGlobalAxe);
$('aiSearchInput').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();askGlobalAxe();}});
document.querySelectorAll('#aiPromptRow button').forEach(function(b){b.addEventListener('click',function(){$('aiSearchInput').value=b.dataset.prompt;askGlobalAxe();});});

// ── Emoji set for Agent tiles ──────────────────────────────
var SPACE_EMOJI = {
  finance:  '💰',
  career:   '💼',
  research: '🔍',
  travel:   '✈️',
  network:  '🤝',
  vault:    '🔐',
};

function tileHtml(space){
  var emoji = SPACE_EMOJI[space.slug] || '🪓';
  var isLive = space.status === 'live';
  return `
    <a class="tile${isLive ? '' : ' dim'}" href="${space.route}">
      <div>
        <div class="tile-icon-wrap" style="background:none;font-size:26px;">${emoji}</div>
        <div class="tile-label">${space.label.toUpperCase()}</div>
      </div>
      <div class="tile-sub" id="status-${space.slug}">${space.tagline || (isLive ? '' : 'Not set up yet')}</div>
    </a>`;
}

async function loadSpaces(){
  var grid = $('bentoGrid');
  try {
    var res = await fetch('/api/spaces');
    var spaces = await res.json();
    grid.innerHTML = spaces.map(tileHtml).join('');

    // Career's tile gets a real, live count. Everything else stays honest
    // about not being built yet rather than showing a made-up number.
    try {
      var oppRes = await fetch('/api/career/opportunities?status=new');
      var opps = await oppRes.json();
      var el = document.getElementById('status-career');
      if (el) el.textContent = opps.length ? (opps.length + ' new opportunit' + (opps.length === 1 ? 'y' : 'ies')) : 'No new opportunities yet';
    } catch (e) { /* Career tile just keeps its default label if this fails */ }

  } catch (err) {
    grid.innerHTML = '<div class="tile"><div class="tile-label">COULD NOT LOAD</div><div class="tile-sub">' + err.message + '</div></div>';
  }
}
loadSpaces();
</script>

<div class="axe-global-actions" aria-label="Global Axe navigation"><a href="/home" title="Home">⌂</a><a href="/cfo" title="Axe chat">🪓</a><a class="axe-profile" href="/logout" title="Profile / sign out">M</a></div>
<nav class="axe-global-nav" aria-label="Axe spaces"><a href="/axefinance" title="Finance">💼</a><a href="/axecareer" title="Career">📈</a><a href="/axeresearch" title="Research">⌕</a><a href="/home" title="All spaces">⌂</a></nav>
<script>
/* Interactive Axe space selector */
(function(){
  var nav=document.querySelector('.axe-global-nav')||document.querySelector('.bottom-nav');
  if(!nav||nav.dataset.selectorReady==='1')return;
  nav.dataset.selectorReady='1';
  nav.classList.add('axe-selector-nav');
  var links=[].slice.call(nav.querySelectorAll('a'));
  var current=location.pathname.replace(/\/$/,'')||'/home';
  var active=links.find(function(link){var href=new URL(link.href,location.origin).pathname.replace(/\/$/,'');return href===current|| (current.startsWith('/axe-career')&&href==='/axecareer');});
  links.forEach(function(link){
    link.classList.add('axe-selector-link');
    var label=link.getAttribute('title')||link.textContent.trim()||'Axe space';
    link.dataset.label=label;link.setAttribute('aria-label',label);
    if(link===active)link.setAttribute('aria-current','page');
  });
  var toggle=document.createElement('button');toggle.type='button';toggle.className='axe-selector-toggle';toggle.setAttribute('aria-label','Open Axe space selector');toggle.setAttribute('aria-expanded','false');toggle.innerHTML=active?active.innerHTML:'⌂';
  nav.insertBefore(toggle,nav.firstChild);
  var helper=document.createElement('div');helper.className='axe-selector-helper';helper.textContent='Select an Axe space';document.body.appendChild(helper);
  function setOpen(open){nav.classList.toggle('axe-selector-open',open);toggle.setAttribute('aria-expanded',String(open));toggle.innerHTML=open?'×':(active?active.innerHTML:'⌂');if(open){helper.classList.add('show');setTimeout(function(){helper.classList.remove('show');},1100);}else helper.classList.remove('show');}
  toggle.addEventListener('click',function(){setOpen(!nav.classList.contains('axe-selector-open'));});
  document.addEventListener('click',function(e){if(!nav.contains(e.target))setOpen(false);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')setOpen(false);});
  links.forEach(function(link){link.addEventListener('click',function(){setOpen(false);});});
})();
</script>
